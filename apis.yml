name: Emma
description: Emma (by EDAILABS) is an AI-powered English language learning application built around a 3D interactive avatar tutor that offers real-time spoken conversation practice, instant pronunciation and grammar corrections, and personalized, adaptive learning paths. Positioned as "more than just a chatbot," the app models native accents and speech patterns for judgment-free practice available 24/7, and reports more than 500,000 users. It is a consumer iOS mobile application backed by Seedcamp; it publishes no public API, SDK, or developer platform at this time.
